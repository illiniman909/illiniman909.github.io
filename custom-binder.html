<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Binder Request &bull; Krusty Kardboard TCG</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px 60px;
      font-family: 'Nunito', sans-serif;
      position: relative;
      overflow-x: hidden;

      background-image: url('cardboard.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* Subtle dark overlay for readability */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: rgba(80, 45, 5, 0.18);
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .logo {
      width: 70%;
      max-width: 300px;
      filter: drop-shadow(0 6px 20px rgba(0,0,0,0.5));
      animation: popIn 0.5s cubic-bezier(0.22, 1.6, 0.36, 1) both;
    }

    .heading {
      font-family: 'Bangers', cursive;
      font-size: 2rem;
      letter-spacing: 1.5px;
      color: #fff;
      text-align: center;
      text-shadow: 0 3px 10px rgba(0,0,0,0.55);
      animation: fadeUp 0.5s 0.2s ease both;
    }

    .divider {
      width: 80%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #5c3610, #2a1200, #5c3610, transparent);
      border-radius: 2px;
      animation: fadeUp 0.5s 0.3s ease both;
    }

    .card {
      width: 100%;
      background: rgba(255, 250, 242, 0.96);
      border-radius: 18px;
      padding: 24px 22px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.18), 0 14px 30px rgba(0,0,0,0.25);
      animation: fadeUp 0.45s 0.35s ease both;
    }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-weight: 900;
      font-size: 0.9rem;
      color: #3a2206;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }
    label .req { color: #c0392b; }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    textarea,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #d8c4a4;
      border-radius: 10px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #2a1a00;
      background: #fffdf8;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #c97f1a;
      box-shadow: 0 0 0 3px rgba(201,127,26,0.2);
    }
    textarea { resize: vertical; min-height: 70px; }

    input[type="file"] {
      width: 100%;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      color: #3a2206;
      padding: 8px 0;
    }
    input[type="file"]::file-selector-button {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, #c97f1a 0%, #9c5e0d 100%);
      border: none;
      padding: 10px 16px;
      border-radius: 9px;
      margin-right: 12px;
      cursor: pointer;
      transition: filter 0.15s ease;
    }
    input[type="file"]::file-selector-button:hover { filter: brightness(1.08); }

    .hint {
      font-size: 0.78rem;
      font-weight: 700;
      color: #8a6a3a;
      margin-top: 5px;
    }

    .note {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 900;
      letter-spacing: 0.3px;
      color: #b5530b;
      background: #fff0db;
      border: 1.5px dashed #e0a35a;
      border-radius: 8px;
      padding: 4px 9px;
      margin-top: 7px;
    }

    /* segmented radio group */
    .segmented {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .segmented input { position: absolute; opacity: 0; pointer-events: none; }
    .segmented label {
      flex: 1 1 0;
      min-width: 120px;
      margin: 0;
      text-align: center;
      padding: 12px 10px;
      border: 2px solid #d8c4a4;
      border-radius: 10px;
      background: #fffdf8;
      cursor: pointer;
      font-weight: 900;
      color: #6b4a18;
      transition: all 0.15s ease;
    }
    .segmented input:checked + label {
      border-color: #c97f1a;
      background: linear-gradient(135deg, #c97f1a 0%, #9c5e0d 100%);
      color: #fff;
      box-shadow: 0 3px 0 rgba(0,0,0,0.18);
    }

    /* color swatch picker */
    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .swatch-hint {
      font-size: 0.85rem;
      font-weight: 700;
      color: #8a6a3a;
    }
    .swatch {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 2px solid #d8c4a4;
      border-radius: 10px;
      background: #fffdf8;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 0.85rem;
      color: #3a2206;
      transition: all 0.15s ease;
    }
    .swatch:hover { border-color: #c97f1a; }
    .swatch.selected {
      border-color: #c97f1a;
      background: #fff4e2;
      box-shadow: 0 0 0 3px rgba(201,127,26,0.2);
    }
    .swatch .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.25);
      flex-shrink: 0;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, #00c244 0%, #009e36 100%);
      box-shadow: 0 4px 0 rgba(0,0,0,0.28), 0 8px 24px rgba(0,0,0,0.2);
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    }
    .submit-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .submit-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.28); }
    .submit-btn:disabled { filter: grayscale(0.4) brightness(0.9); cursor: not-allowed; transform: none; }

    .result {
      margin-top: 16px;
      text-align: center;
      font-weight: 900;
      font-size: 0.95rem;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }
    .result.success { display: block; background: #e3f9e6; color: #1c7a30; border: 2px solid #9bdfae; }
    .result.error   { display: block; background: #fdecea; color: #b3261e; border: 2px solid #f1a9a4; }

    .back-link {
      margin-top: 6px;
      font-weight: 900;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      color: #fff;
      text-decoration: none;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
      opacity: 0.9;
      animation: fadeUp 0.4s 0.6s ease both;
    }
    .back-link:hover { opacity: 1; text-decoration: underline; }

    @keyframes popIn {
      from { transform: scale(0.75) rotate(-2deg); opacity: 0; }
      to   { transform: scale(1) rotate(0deg);     opacity: 1; }
    }
    @keyframes fadeUp {
      from { transform: translateY(18px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">

    <img class="logo" src="logo.png" alt="Krusty Kardboard TCG" />
    <h1 class="heading">Custom Binder Request</h1>
    <div class="divider"></div>

    <form id="binderForm" class="card">
      <!-- Honeypot spam protection -->
      <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off" />

      <div class="field">
        <label for="name">Name <span class="req">*</span></label>
        <input type="text" id="name" name="name" autocomplete="name" required />
      </div>

      <div class="field">
        <label for="phone">Phone <span class="req">*</span></label>
        <input type="tel" id="phone" name="phone" autocomplete="tel" required />
      </div>

      <div class="field">
        <label for="email">Email <span class="req">*</span></label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="address">Shipping Address <span class="req">*</span></label>
        <textarea id="address" name="address" autocomplete="street-address" placeholder="Street, City, State, ZIP" required></textarea>
      </div>

      <div class="field">
        <label for="front_image">Front Image <span class="req">*</span></label>
        <input type="file" id="front_image" name="front_image" accept="image/*" required />
        <p class="hint">The artwork / photo you want on the front of your binder.</p>
      </div>

      <div class="field">
        <label for="back_image">Back Image</label>
        <input type="file" id="back_image" name="back_image" accept="image/*" />
        <span class="note">&#9733; Back images are an extra charge</span>
      </div>

      <div class="field">
        <label>Brand <span class="req">*</span></label>
        <div class="segmented">
          <input type="radio" id="brand_vaultx" name="binder_brand" value="Vault X" required />
          <label for="brand_vaultx">Vault X</label>
          <input type="radio" id="brand_morabto" name="binder_brand" value="Morabto" />
          <label for="brand_morabto">Morabto</label>
        </div>
      </div>

      <div class="field">
        <label>Binder Size <span class="req">*</span></label>
        <div class="segmented">
          <input type="radio" id="size_4" name="binder_size" value="4 cards per page" required />
          <label for="size_4">4 per page</label>
          <input type="radio" id="size_9" name="binder_size" value="9 cards per page" />
          <label for="size_9">9 per page</label>
        </div>
      </div>

      <div class="field">
        <label>Binder Type <span class="req">*</span></label>
        <div class="segmented">
          <input type="radio" id="type_toploader" name="binder_type" value="Toploader binder" required />
          <label for="type_toploader">Toploader</label>
          <input type="radio" id="type_no_toploader" name="binder_type" value="No toploader" />
          <label for="type_no_toploader">No Toploader</label>
        </div>
      </div>

      <div class="field">
        <label>Binder Color <span class="req">*</span></label>
        <div class="swatches" id="swatches">
          <p class="swatch-hint">Pick a brand and size above to see available colors.</p>
        </div>
        <input type="hidden" name="binder_color" id="binder_color" />
      </div>

      <div class="field">
        <label for="notes">Additional Notes</label>
        <textarea id="notes" name="notes" placeholder="Color details, sizing, or anything else we should know."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit Request</button>
      <div class="result" id="result"></div>
    </form>

    <a class="back-link" href="index.html">&larr; Back to Home</a>

  </div>

  <script>
    // URL of the Cloudflare Worker that holds the API keys and handles the
    // image upload + email. See cloudflare-worker/README.md to deploy it.
    const WORKER_URL = 'https://patient-boat-b7e4.illiniman909.workers.dev/';

    const form = document.getElementById('binderForm');
    const result = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');

    /* ===================================================================
       AVAILABLE BINDER COLORS  —  EDIT ME
       Lists the colors offered for each Brand + Size. These are STARTER
       values — please confirm/correct them against the Amazon listings.
       To add a color, just add its name to the array; if its swatch dot
       needs a specific shade, add the name + hex to COLOR_HEX below.
       =================================================================== */
    const BINDER_COLORS = {
      'Vault X': {
        // From the Amazon listing (ASIN B08G8VFJS6 family).
        '4 cards per page': ['Black', 'Green', 'Purple', 'Red', 'Teal', 'Yellow'],
        // From the Amazon listing (ASIN B082J5NZQ3 family).
        '9 cards per page': ['Black', 'Blue', 'Pink', 'Purple', 'Red', 'Teal', 'Yellow']
      },
      'Morabto': {
        '4 cards per page': ['Black', 'Blue', 'Red', 'Green', 'Purple', 'Pink', 'White'],
        '9 cards per page': ['Black', 'Blue', 'Dark Green', 'Grass Green', 'Light Blue', 'Orange', 'Pink', 'Purple', 'Red', 'Turquoise', 'White']
      }
    };

    // Swatch dot colors. Any color name not listed falls back to grey.
    const COLOR_HEX = {
      'Black': '#1c1c1c', 'White': '#f4f3ee', 'Grey': '#8b8b8b', 'Gray': '#8b8b8b',
      'Red': '#c0392b', 'Blue': '#2257c0', 'Navy': '#1b2a52', 'Green': '#2e8b4f',
      'Dark Green': '#1f5c34', 'Grass Green': '#4a9e2f', 'Light Blue': '#7fc4e8',
      'Purple': '#7d3cc0', 'Pink': '#e87aa8', 'Orange': '#e8852b', 'Yellow': '#f2c829',
      'Teal': '#1aa39a', 'Turquoise': '#1abc9c', 'Aqua': '#3fc6c6', 'Brown': '#7a4a25', 'Gold': '#caa334'
    };

    const swatches = document.getElementById('swatches');
    const colorInput = document.getElementById('binder_color');

    function renderSwatches() {
      const brand = form.querySelector('input[name="binder_brand"]:checked');
      const size = form.querySelector('input[name="binder_size"]:checked');
      colorInput.value = '';

      if (!brand || !size) {
        swatches.innerHTML = '<p class="swatch-hint">Pick a brand and size above to see available colors.</p>';
        return;
      }

      const colors = (BINDER_COLORS[brand.value] && BINDER_COLORS[brand.value][size.value]) || [];
      if (!colors.length) {
        swatches.innerHTML = '<p class="swatch-hint">No colors are listed for this option yet — please use Additional Notes.</p>';
        return;
      }

      swatches.innerHTML = '';
      colors.forEach(function (name) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'swatch';
        btn.innerHTML = '<span class="dot" style="background:' + (COLOR_HEX[name] || '#cccccc') + '"></span>' + name;
        btn.addEventListener('click', function () {
          swatches.querySelectorAll('.swatch').forEach(function (s) { s.classList.remove('selected'); });
          btn.classList.add('selected');
          colorInput.value = name;
        });
        swatches.appendChild(btn);
      });
    }

    form.querySelectorAll('input[name="binder_brand"], input[name="binder_size"]').forEach(function (el) {
      el.addEventListener('change', renderSwatches);
    });

    function showResult(type, message) {
      result.className = 'result ' + type;
      result.textContent = message;
      result.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      // The color swatch picker uses a hidden input, so validate it manually.
      if (!colorInput.value) {
        showResult('error', 'Please choose a binder color.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';
      result.className = 'result';

      try {
        // Send everything (text + image files) to the Worker, which uploads
        // the images and emails the request using its secret keys.
        const formData = new FormData(form);
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          body: formData
        });
        const data = await response.json();

        if (data.success) {
          showResult('success', 'Thanks! Your custom binder request has been sent. We’ll be in touch soon.');
          form.reset();
        } else {
          showResult('error', data.message || 'Something went wrong. Please try again.');
        }
      } catch (err) {
        showResult('error', (err && err.message) || 'Network error. Please check your connection and try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Request';
      }
    });
  </script>
</body>
</html>
